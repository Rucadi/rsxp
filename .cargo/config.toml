[alias]
# Regenerate the checked-in OpenAPI document from the shared control catalog.
api-openapi = "run --quiet -p fanplay-mcp -- --openapi"

# Statically link the MinGW C runtime and libgcc so the portable Windows build
# does not depend on shipping libgcc_s_seh-1.dll / libwinpthread-1.dll /
# libstdc++-6.dll next to fanplay.exe.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]
