name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  nix:
    name: Linux / Nix (cachix)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          # External cache identity is independent of the product rename.
          name: ${{ vars.CACHIX_CACHE || 'rsxp' }}
          authToken: '${{ secrets.CACHIX_KEY }}'
      - name: Build and test desktop with Nix
        run: nix build --print-build-logs .#fanplay

  windows-nix:
    name: Windows / Nix cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          # External cache identity is independent of the product rename.
          name: ${{ vars.CACHIX_CACHE || 'rsxp' }}
          authToken: '${{ secrets.CACHIX_KEY }}'
      - name: Build Windows bundle with Nix and upload it to Cachix
        run: nix build --print-build-logs --print-out-paths .#windows | tee windows-store-path.txt
      - name: Create portable ZIP with bin contents at its root
        run: |
          store_path="$(tail -n 1 windows-store-path.txt)"
          test -d "$store_path/bin"
          mkdir -p artifacts
          (cd "$store_path/bin" && zip -qr "$GITHUB_WORKSPACE/artifacts/fanplay-windows-x86_64-nix.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: fanplay-windows-x86_64-nix
          path: artifacts/fanplay-windows-x86_64-nix.zip
          if-no-files-found: error

  appimage:
    name: Linux / AppImage (Nix)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          # External cache identity is independent of the product rename.
          name: ${{ vars.CACHIX_CACHE || 'rsxp' }}
          authToken: '${{ secrets.CACHIX_KEY }}'
      - name: Build AppImage with its Nix runtime closure
        run: |
          nix build --print-build-logs .#appimage --out-link result-appimage
          mkdir -p artifacts
          cp -L result-appimage artifacts/fanplay-linux-x86_64.AppImage
          chmod +x artifacts/fanplay-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: fanplay-linux-x86_64
          path: artifacts/*.AppImage
          if-no-files-found: error

  web:
    name: Browser / WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE || 'rsxp' }}
          authToken: '${{ secrets.CACHIX_KEY }}'
      - name: Pin legacy nix-shell to the flake nixpkgs
        run: |
          echo "NIXPKGS_PATH=$(nix eval --impure --raw --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')" >> "$GITHUB_ENV"
      - name: Build the browser Ruby image and native bindings
        run: nix-shell -I "nixpkgs=$NIXPKGS_PATH" --run 'tools/build-ruby-wasm.sh'
      - name: Install the browser Ruby smoke-test adapter
        run: nix-shell -I "nixpkgs=$NIXPKGS_PATH" --run 'npm install --prefix target/ruby-wasm/check --no-save @ruby/wasm-wasi@2.10.1'
      - name: Check Ruby WASM bindings and audio bridge
        run: nix-shell -I "nixpkgs=$NIXPKGS_PATH" --run 'NODE_PATH="$PWD/target/ruby-wasm/check/node_modules" node tools/check-ruby-wasm.cjs'
      - name: Check web worker JavaScript
        run: nix-shell -I "nixpkgs=$NIXPKGS_PATH" --run 'node --check frontends/web/rgss_worker.js'
      - name: Test RGSS worker route qualification
        run: nix-shell -I "nixpkgs=$NIXPKGS_PATH" --run 'cargo test -p fanplay-rgss --lib'
      - name: Build the production Trunk bundle
        run: nix-shell -I "nixpkgs=$NIXPKGS_PATH" --run 'cd frontends/web && CARGO_TARGET_DIR=../../target/web-release NO_COLOR=false trunk build --release --dist ../../target/trunk-dist'
      - name: Verify production web assets
        run: |
          test -s target/trunk-dist/index.html
          test -s target/trunk-dist/ruby.wasm
          test -s target/trunk-dist/rgss_worker.js
          grep -q 'fanplay-web-' target/trunk-dist/index.html
      - name: Package browser bundle
        run: |
          mkdir -p artifacts/fanplay-web
          cp -a target/trunk-dist/. artifacts/fanplay-web/
          (cd artifacts/fanplay-web && zip -qr ../fanplay-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: fanplay-web
          path: artifacts/fanplay-web.zip
          if-no-files-found: error

  desktop:
    name: Desktop / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            # Match RubyInstaller's GNU ABI rather than the MSVC default.
            target: x86_64-pc-windows-gnu
            suffix: .exe
          - os: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
            suffix: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:/Program Files/LLVM/bin' >> "$GITHUB_ENV"
      - name: Configure macOS libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: desktop-${{ matrix.target }}-ruby-3.4
      - name: Build desktop
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --bin fanplay --target "$BUILD_TARGET"
      - name: Smoke-test desktop and embedded Ruby
        env:
          BUILD_TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          binary="target/$BUILD_TARGET/release/fanplay$EXE_SUFFIX"
          "$binary" --version
          "$binary" run --script crates/fanplay-rgss/testdata/rgss_smoke.rb --headless
      - name: Bundle Ruby and native dependencies
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python tools/package-runtime.py "target/$BUILD_TARGET/release/fanplay.exe" artifacts/windows
          else
            python tools/package-runtime.py "target/$BUILD_TARGET/release/fanplay" artifacts/macos
          fi
      - name: Test relocated runtime without development environment
        if: runner.os == 'macOS'
        run: |
          mv artifacts/macos 'artifacts/Relocated FANPLAY'
          binary="$PWD/artifacts/Relocated FANPLAY/FANPLAY.app/Contents/MacOS/fanplay"
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            PATH=/usr/bin:/bin "$binary" --version
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            PATH=/usr/bin:/bin "$binary" run --script "$PWD/tools/package-smoke.rb" --headless
          mv 'artifacts/Relocated FANPLAY' artifacts/macos
      - name: Build and test macOS disk image
        if: runner.os == 'macOS'
        run: |
          # The app bundles its own Ruby and libraries, so it ships as a normal
          # drag-to-Applications disk image rather than a system installer.
          mkdir -p artifacts/dmg
          ditto artifacts/macos/FANPLAY.app artifacts/dmg/FANPLAY.app
          ln -s /Applications artifacts/dmg/Applications
          hdiutil create -volname FANPLAY -srcfolder artifacts/dmg -ov -format UDZO \
            artifacts/fanplay-macos-arm64.dmg
          rm -rf artifacts/dmg
          # Mount the image and copy the app out, exactly like dragging it to
          # /Applications, then smoke-test the relocated copy.
          mount=$(mktemp -d)
          install=$(mktemp -d)
          hdiutil attach artifacts/fanplay-macos-arm64.dmg -nobrowse -readonly -mountpoint "$mount"
          test -d "$mount/FANPLAY.app"
          ditto "$mount/FANPLAY.app" "$install/FANPLAY.app"
          hdiutil detach "$mount"
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH PATH=/usr/bin:/bin \
            "$install/FANPLAY.app/Contents/MacOS/fanplay" run --script "$PWD/tools/package-smoke.rb" --headless
          rm -rf "$install" "$mount"
      - name: Diagnose Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Best-effort diagnostics: this step never fails the job. It reports
          # what the executable imports, which dependencies are unresolved, any
          # embedded manifest, how it behaves under a minimal PATH, and the
          # SideBySide/Application events Windows logged for the failed launch.
          $ErrorActionPreference = 'Continue'
          $portable = Join-Path "$env:RUNNER_TEMP" 'FANPLAY portable test'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -Recurse -Force artifacts/windows/* $portable

          Write-Host '=== portable contents ==='
          Get-ChildItem $portable | Sort-Object Name |
            Format-Table Name, Length -AutoSize | Out-String | Write-Host

          $objdump = (Get-Command x86_64-w64-mingw32-objdump -ErrorAction SilentlyContinue).Source
          if (-not $objdump) { $objdump = (Get-Command objdump -ErrorAction SilentlyContinue).Source }
          function Get-Imports([string]$path) {
            if (-not $objdump) { return @() }
            (& $objdump -p $path) | Select-String 'DLL Name:\s*(\S+)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
          }
          if ($objdump) {
            Write-Host "=== fanplay.exe imports (via $objdump) ==="
            Get-Imports "$portable\fanplay.exe" | ForEach-Object { Write-Host "  $_" }
            Write-Host '=== unresolved dependencies across the portable set ==='
            $local = @{}
            Get-ChildItem $portable -Filter *.dll | ForEach-Object { $local[$_.Name.ToLowerInvariant()] = $true }
            $missing = 0
            foreach ($bin in @(Get-Item "$portable\fanplay.exe") + @(Get-ChildItem $portable -Filter *.dll)) {
              foreach ($dep in Get-Imports $bin.FullName) {
                if (-not $local.ContainsKey($dep.ToLowerInvariant()) -and
                    -not (Test-Path (Join-Path "$env:SystemRoot\System32" $dep))) {
                  Write-Host "  MISSING: $($bin.Name) -> $dep"
                  $missing++
                }
              }
            }
            Write-Host "  (missing count: $missing)"
          } else {
            Write-Host 'objdump not found; skipping import analysis'
          }

          $manifest = Join-Path "$env:TEMP" 'fanplay.manifest'
          Remove-Item $manifest -ErrorAction SilentlyContinue
          $mt = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($mt) { & $mt.FullName "-inputresource:$portable\fanplay.exe;#1" "-out:$manifest" | Out-Null }
          if (Test-Path $manifest) {
            Write-Host '=== fanplay.exe embedded manifest ==='
            Get-Content $manifest | Write-Host
          } else {
            Write-Host '=== no manifest extracted; scanning exe bytes for <assembly> ==='
            $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes("$portable\fanplay.exe"))
            $index = $text.IndexOf('<assembly')
            if ($index -ge 0) { Write-Host $text.Substring($index, [Math]::Min(1600, $text.Length - $index)) }
            else { Write-Host 'no <assembly> block found in exe' }
          }

          function Invoke-Probe([string]$label) {
            Write-Host "=== run: $label ==="
            $out = Join-Path "$env:TEMP" 'fanplay-probe.out'
            $err = Join-Path "$env:TEMP" 'fanplay-probe.err'
            Remove-Item $out, $err -ErrorAction SilentlyContinue
            try {
              $proc = Start-Process -FilePath "$portable\fanplay.exe" -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
              Write-Host ("  exit=0x{0:X8}" -f $proc.ExitCode)
            } catch {
              Write-Host "  launch exception: $($_.Exception.Message)"
            }
            if (Test-Path $out) { Get-Content $out | Write-Host }
            if (Test-Path $err) { Get-Content $err | Write-Host }
          }

          Invoke-Probe 'full development PATH'
          $env:PATH = "$portable;$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:RUBYLIB,Env:GEM_HOME,Env:GEM_PATH -ErrorAction SilentlyContinue
          Invoke-Probe 'minimal PATH (portable + System32)'

          Write-Host '=== recent SideBySide / Application Error events ==='
          Get-WinEvent -LogName Application -MaxEvents 100 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'SideBySide|Application Error|Windows Error Reporting' } |
            Select-Object -First 8 TimeCreated, Id, ProviderName, Message |
            Format-List | Out-String | Write-Host
          exit 0

      - name: Package Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Package before smoke tests so the artifact remains available even
          # when a Windows runtime check exposes a failure for local debugging.
          $portable = Join-Path $env:RUNNER_TEMP 'FANPLAY portable test'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -Recurse -Force artifacts/windows/* $portable
          $stage = 'artifacts/fanplay-windows-x86_64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force artifacts/windows/* $stage
          Compress-Archive -Path $stage -DestinationPath artifacts/fanplay-windows-x86_64.zip -Force
      - name: Smoke-test Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          # Restrict PATH to the bundled files and Windows itself so the test
          # proves nothing is needed from the build toolchain. Failures remain
          # visible in the job summary but do not prevent artifact upload.
          $portable = Join-Path $env:RUNNER_TEMP 'FANPLAY portable test'
          $env:PATH = "$portable;$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:RUBYLIB,Env:GEM_HOME,Env:GEM_PATH -ErrorAction SilentlyContinue
          & "$portable\fanplay.exe" --version
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem $portable | Select-Object Name | Out-String | Write-Host
            throw "portable fanplay --version failed ($LASTEXITCODE)"
          }
          & "$portable\fanplay.exe" run --script "$PWD/tools/package-smoke.rb" --headless
          if ($LASTEXITCODE -ne 0) { throw "portable runtime smoke test failed ($LASTEXITCODE)" }
      - name: Upload Windows portable debug files
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: fanplay-windows-portable-debug
          path: |
            ${{ runner.temp }}/FANPLAY portable test/fanplay.exe
            ${{ runner.temp }}/FANPLAY portable test/*.dll
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && (runner.os == 'Windows' || (runner.os == 'macOS' && hashFiles('artifacts/*.dmg') != ''))
        with:
          name: fanplay-${{ matrix.platform }}
          path: |
            artifacts/*.dmg
            artifacts/*.zip
          if-no-files-found: error

  release-assets:
    name: Attach build artifacts to GitHub Release
    if: github.event_name == 'release'
    needs: [appimage, desktop, web, windows-nix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fanplay-linux-x86_64
          path: release-assets
          merge-multiple: true
      - name: Download Windows Nix bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fanplay-windows-x86_64-nix
          path: release-assets
          merge-multiple: true
      - name: Download Windows portable bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fanplay-windows-x86_64
          path: release-assets
          merge-multiple: true
      - name: Download macOS disk image
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fanplay-macos-arm64
          path: release-assets
          merge-multiple: true
      - name: Download browser bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fanplay-web
          path: release-assets
          merge-multiple: true
      - name: Upload files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if ((${#assets[@]} == 0)); then
            echo "No build artifacts were downloaded for release $RELEASE_TAG" >&2
            exit 1
          fi
          upload_failed=0
          for asset in "${assets[@]}"; do
            echo "Uploading ${asset#release-assets/}"
            if ! gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Failed to upload ${asset#release-assets/}" >&2
              upload_failed=1
            fi
          done
          exit "$upload_failed"
