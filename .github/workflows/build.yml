name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux / Nix AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-linux-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-linux-
      - name: Build and test desktop with Nix
        run: nix build --print-build-logs .#rsxp
      - name: Build AppImage with its Nix runtime closure
        run: |
          nix build --print-build-logs .#appimage --out-link result-appimage
          mkdir -p artifacts
          cp -L result-appimage artifacts/rsxp-linux-x86_64.AppImage
          chmod +x artifacts/rsxp-linux-x86_64.AppImage
      - name: Smoke-test AppImage without a Nix store
        run: |
          # The nix-appimage AppRun uses an unprivileged user namespace plus
          # chroot; Docker's default seccomp/AppArmor profiles block that.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD:/work" -w /work ubuntu:24.04 \
            bash -ec 'export APPIMAGE_EXTRACT_AND_RUN=1; \
              artifacts/rsxp-linux-x86_64.AppImage --version; \
              artifacts/rsxp-linux-x86_64.AppImage run --script tools/package-smoke.rb --headless'
      - uses: actions/upload-artifact@v4
        with:
          name: rsxp-linux-x86_64
          path: artifacts/*.AppImage
          if-no-files-found: error

  desktop:
    name: Desktop / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            # Match RubyInstaller's GNU ABI rather than the MSVC default.
            target: x86_64-pc-windows-gnu
            suffix: .exe
          - os: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
            suffix: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:/Program Files/LLVM/bin' >> "$GITHUB_ENV"
      - name: Configure macOS libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: desktop-${{ matrix.target }}-ruby-3.4
      - name: Build desktop
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --bin rsxp --target "$BUILD_TARGET"
      - name: Smoke-test desktop and embedded Ruby
        env:
          BUILD_TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          binary="target/$BUILD_TARGET/release/rsxp$EXE_SUFFIX"
          "$binary" --version
          "$binary" run --script rust/testdata/rgss_smoke.rb --headless
      - name: Bundle Ruby and native dependencies
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python tools/package-runtime.py "target/$BUILD_TARGET/release/rsxp.exe" artifacts/windows
          else
            python tools/package-runtime.py "target/$BUILD_TARGET/release/rsxp" artifacts/macos
          fi
      - name: Test relocated runtime without development environment
        if: runner.os == 'macOS'
        run: |
          mv artifacts/macos 'artifacts/Relocated RSXP'
          binary="$PWD/artifacts/Relocated RSXP/RSXP.app/Contents/MacOS/rsxp"
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            PATH=/usr/bin:/bin "$binary" --version
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            PATH=/usr/bin:/bin "$binary" run --script "$PWD/tools/package-smoke.rb" --headless
          mv 'artifacts/Relocated RSXP' artifacts/macos
      - name: Build and test macOS disk image
        if: runner.os == 'macOS'
        run: |
          # The app bundles its own Ruby and libraries, so it ships as a normal
          # drag-to-Applications disk image rather than a system installer.
          mkdir -p artifacts/dmg
          ditto artifacts/macos/RSXP.app artifacts/dmg/RSXP.app
          ln -s /Applications artifacts/dmg/Applications
          hdiutil create -volname RSXP -srcfolder artifacts/dmg -ov -format UDZO \
            artifacts/rsxp-macos-arm64.dmg
          rm -rf artifacts/dmg
          # Mount the image and copy the app out, exactly like dragging it to
          # /Applications, then smoke-test the relocated copy.
          mount=$(mktemp -d)
          install=$(mktemp -d)
          hdiutil attach artifacts/rsxp-macos-arm64.dmg -nobrowse -readonly -mountpoint "$mount"
          test -d "$mount/RSXP.app"
          ditto "$mount/RSXP.app" "$install/RSXP.app"
          hdiutil detach "$mount"
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH PATH=/usr/bin:/bin \
            "$install/RSXP.app/Contents/MacOS/rsxp" run --script "$PWD/tools/package-smoke.rb" --headless
          rm -rf "$install" "$mount"
      - name: Test and package Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ship the executable plus its DLLs as a portable folder; no installer.
          $portable = Join-Path $env:RUNNER_TEMP 'RSXP portable test'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -Recurse -Force artifacts/windows/* $portable
          # Restrict PATH to the bundled files and Windows itself so the test
          # proves nothing is needed from the build toolchain.
          $env:PATH = "$portable;$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:RUBYLIB,Env:GEM_HOME,Env:GEM_PATH -ErrorAction SilentlyContinue
          & "$portable\rsxp.exe" --version
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem $portable | Select-Object Name | Out-String | Write-Host
            throw "portable rsxp --version failed ($LASTEXITCODE)"
          }
          & "$portable\rsxp.exe" run --script "$PWD/tools/package-smoke.rb" --headless
          if ($LASTEXITCODE -ne 0) { throw "portable runtime smoke test failed" }
          $stage = 'artifacts/rsxp-windows-x86_64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force artifacts/windows/* $stage
          Compress-Archive -Path $stage -DestinationPath artifacts/rsxp-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: rsxp-${{ matrix.platform }}
          path: |
            artifacts/*.dmg
            artifacts/*.zip
          if-no-files-found: error

  browser:
    name: Browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-browser-${{ hashFiles('flake.lock', 'Cargo.lock', 'web/**/Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-browser-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            web/engine -> target
            web/xtask -> target
            web -> target
          key: browser
      - name: Build browser player
        run: nix develop --command cargo xtask web
      - name: Check build tool and browser runtime
        run: |
          nix develop --command cargo test --locked --manifest-path web/xtask/Cargo.toml
          nix develop --command cargo test --locked --manifest-path web/Cargo.toml
          nix develop --command npm --prefix web test
          nix develop --command npm --prefix web run test:cli
      - name: Export the standalone player page
        run: nix develop --command web/target/release/rsxp-web export web/dist/rsxp.html
      - uses: actions/upload-artifact@v4
        with:
          name: rsxp.html
          path: web/dist/rsxp.html
          if-no-files-found: error

  web-player:
    name: Web player / ${{ matrix.platform }}
    needs: browser
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            suffix: ''
          - os: windows-2022
            platform: windows-x86_64
            suffix: .exe
          - os: macos-14
            platform: macos-arm64
            suffix: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
      - uses: actions/download-artifact@v4
        with:
          name: rsxp.html
          path: web/dist
      - name: Stage the exported page as the compile-time embed
        run: cp web/dist/rsxp.html web/dist/player.html
      - name: Build native web player
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            nix develop --command cargo build --locked --release --manifest-path web/Cargo.toml
          else
            cargo build --locked --release --manifest-path web/Cargo.toml
          fi
      - name: Smoke-test export
        env:
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          "web/target/release/rsxp-web$EXE_SUFFIX" --help
          "web/target/release/rsxp-web$EXE_SUFFIX" export web/dist/export-test.html
          cmp web/dist/player.html web/dist/export-test.html
      - name: Package web player
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p artifacts/rsxp-web
          cp "web/target/release/rsxp-web$EXE_SUFFIX" artifacts/rsxp-web/
          cp COPYING web/README.md artifacts/rsxp-web/
          tar -czf "artifacts/rsxp-web-$PLATFORM.tar.gz" -C artifacts rsxp-web
      - uses: actions/upload-artifact@v4
        with:
          name: rsxp-web-${{ matrix.platform }}
          path: artifacts/rsxp-web-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  pages:
    name: Publish GitHub Pages
    needs: browser
    # Only the default branch publishes; pull requests just build.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rsxp.html
          path: site
      - name: Serve the player as the site index
        run: cp site/rsxp.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
