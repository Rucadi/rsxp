name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux / Nix AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-linux-${{ hashFiles('flake.lock', 'Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-linux-
      - name: Build and test desktop with Nix
        run: nix build --print-build-logs .#rsxp
      - name: Build AppImage with its Nix runtime closure
        run: |
          nix build --print-build-logs .#appimage --out-link result-appimage
          mkdir -p artifacts
          cp -L result-appimage artifacts/rsxp-linux-x86_64.AppImage
          chmod +x artifacts/rsxp-linux-x86_64.AppImage
      - name: Smoke-test AppImage without a Nix store
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker run --rm -v "$PWD:/work" -w /work ubuntu:24.04 \
            bash -ec 'export APPIMAGE_EXTRACT_AND_RUN=1; \
              artifacts/rsxp-linux-x86_64.AppImage --version; \
              artifacts/rsxp-linux-x86_64.AppImage run --script tools/package-smoke.rb --headless'
      - uses: actions/upload-artifact@v4
        with:
          name: rsxp-linux-x86_64
          path: artifacts/*.AppImage
          if-no-files-found: error

  desktop:
    name: Desktop / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            # Match RubyInstaller's GNU ABI rather than the MSVC default.
            target: x86_64-pc-windows-gnu
            suffix: .exe
          - os: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
            suffix: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:/Program Files/LLVM/bin' >> "$GITHUB_ENV"
      - name: Configure macOS libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: desktop-${{ matrix.target }}-ruby-3.4
      - name: Build desktop
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --bin rsxp --target "$BUILD_TARGET"
      - name: Smoke-test desktop and embedded Ruby
        env:
          BUILD_TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          binary="target/$BUILD_TARGET/release/rsxp$EXE_SUFFIX"
          "$binary" --version
          "$binary" run --script rust/testdata/rgss_smoke.rb --headless
      - name: Bundle Ruby and native dependencies
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python tools/package-runtime.py "target/$BUILD_TARGET/release/rsxp.exe" artifacts/windows
          else
            python tools/package-runtime.py "target/$BUILD_TARGET/release/rsxp" artifacts/macos
          fi
      - name: Test relocated runtime without development environment
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            mv artifacts/windows 'artifacts/Relocated RSXP'
            binary="$PWD/artifacts/Relocated RSXP/rsxp.exe"
          else
            mv artifacts/macos 'artifacts/Relocated RSXP'
            binary="$PWD/artifacts/Relocated RSXP/RSXP.app/Contents/MacOS/rsxp"
          fi
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            PATH=/usr/bin:/bin "$binary" --version
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            PATH=/usr/bin:/bin "$binary" run --script "$PWD/tools/package-smoke.rb" --headless
          if [ "$RUNNER_OS" = Windows ]; then
            mv 'artifacts/Relocated RSXP' artifacts/windows
          else
            mv 'artifacts/Relocated RSXP' artifacts/macos
          fi
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: |
          pkgbuild --component artifacts/macos/RSXP.app --install-location /Applications \
            --identifier org.rsxp.engine --version 0.1.0 artifacts/rsxp-macos-arm64.pkg
          pkgutil --expand-full artifacts/rsxp-macos-arm64.pkg artifacts/pkg-expanded
          binary=$(find artifacts/pkg-expanded -path '*/RSXP.app/Contents/MacOS/rsxp' -type f -print -quit)
          test -n "$binary"
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH PATH=/usr/bin:/bin \
            "$binary" run --script "$PWD/tools/package-smoke.rb" --headless
      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 is missing from the runner" }
          & $compiler tools/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          $install = Join-Path $env:RUNNER_TEMP 'RSXP installed test'
          $process = Start-Process artifacts/rsxp-windows-x86_64-setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$install`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed: $($process.ExitCode)" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:RUBYLIB,Env:GEM_HOME,Env:GEM_PATH -ErrorAction SilentlyContinue
          & "$install\rsxp.exe" run --script "$PWD/tools/package-smoke.rb" --headless
          if ($LASTEXITCODE -ne 0) { throw "Installed runtime failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: rsxp-${{ matrix.platform }}
          path: |
            artifacts/*.pkg
            artifacts/*-setup.exe
          if-no-files-found: error

  browser:
    name: Browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-browser-${{ hashFiles('flake.lock', 'Cargo.lock', 'web/**/Cargo.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-browser-
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            web/engine -> target
            web/xtask -> target
            web -> target
          key: browser
      - name: Build browser player
        run: nix develop --command cargo xtask web
      - name: Check build tool and browser runtime
        run: |
          nix develop --command cargo test --locked --manifest-path web/xtask/Cargo.toml
          nix develop --command cargo test --locked --manifest-path web/Cargo.toml
          nix develop --command npm --prefix web test
          nix develop --command npm --prefix web run test:cli
      - uses: actions/upload-artifact@v4
        with:
          name: player-html
          path: web/dist/player.html
          if-no-files-found: error

  web-player:
    name: Web player / ${{ matrix.platform }}
    needs: browser
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            suffix: ''
          - os: windows-2022
            platform: windows-x86_64
            suffix: .exe
          - os: macos-14
            platform: macos-arm64
            suffix: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
      - uses: actions/download-artifact@v4
        with:
          name: player-html
          path: web/dist
      - name: Build native web player
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            nix develop --command cargo build --locked --release --manifest-path web/Cargo.toml
          else
            cargo build --locked --release --manifest-path web/Cargo.toml
          fi
      - name: Smoke-test export
        env:
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          "web/target/release/rsxp-web$EXE_SUFFIX" --help
          "web/target/release/rsxp-web$EXE_SUFFIX" export web/dist/export-test.html
          cmp web/dist/player.html web/dist/export-test.html
      - name: Package web player
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p artifacts/rsxp-web
          cp "web/target/release/rsxp-web$EXE_SUFFIX" artifacts/rsxp-web/
          cp COPYING web/README.md artifacts/rsxp-web/
          tar -czf "artifacts/rsxp-web-$PLATFORM.tar.gz" -C artifacts rsxp-web
      - uses: actions/upload-artifact@v4
        with:
          name: rsxp-web-${{ matrix.platform }}
          path: artifacts/rsxp-web-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
