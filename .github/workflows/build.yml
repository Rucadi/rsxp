name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  nix:
    name: Linux / Nix (cachix)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: rsxp
          authToken: '${{ secrets.CACHIX_KEY }}'
      - name: Build and test desktop with Nix
        run: nix build --print-build-logs .#rsxp

  windows-nix:
    name: Windows / Nix cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: rsxp
          authToken: '${{ secrets.CACHIX_KEY }}'
      - name: Build Windows bundle with Nix and upload it to Cachix
        run: nix build --print-build-logs --print-out-paths .#windows | tee windows-store-path.txt
      - name: Create portable ZIP with bin contents at its root
        run: |
          store_path="$(tail -n 1 windows-store-path.txt)"
          test -d "$store_path/bin"
          mkdir -p artifacts
          (cd "$store_path/bin" && zip -qr "$GITHUB_WORKSPACE/artifacts/rsxp-windows-x86_64-nix.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: rsxp-windows-x86_64-nix
          path: artifacts/rsxp-windows-x86_64-nix.zip
          if-no-files-found: error

  appimage:
    name: Linux / AppImage (Debian 11)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The AppImage is built in a plain Debian 11 image rather than with Nix,
      # so it links against an old glibc (2.31) and runs on Ubuntu 20.04+ and
      # every newer distribution. See packaging/appimage/Dockerfile.
      - uses: docker/setup-buildx-action@v3
      - name: Build the AppImage toolchain image
        uses: docker/build-push-action@v6
        with:
          context: packaging/appimage
          file: packaging/appimage/Dockerfile
          tags: rsxp-appimage
          load: true
          cache-from: type=gha,scope=appimage
          cache-to: type=gha,mode=max,scope=appimage
      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            .appimage-cache/cargo-registry
            .appimage-cache/cargo-git
            .appimage-cache/target
          key: appimage-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            appimage-${{ runner.os }}-
      - name: Build AppImage
        run: |
          mkdir -p .appimage-cache/cargo-registry .appimage-cache/cargo-git \
            .appimage-cache/target artifacts
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD":/src \
            --volume "$PWD/.appimage-cache/cargo-registry":/usr/local/cargo/registry \
            --volume "$PWD/.appimage-cache/cargo-git":/usr/local/cargo/git \
            --volume "$PWD/.appimage-cache/target":/src/target \
            --workdir /src \
            rsxp-appimage \
            bash tools/build-appimage.sh /src/artifacts
      - name: Smoke-test AppImage without a build environment
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          artifacts/rsxp-linux-x86_64.AppImage --version
          artifacts/rsxp-linux-x86_64.AppImage run --script tools/package-smoke.rb --headless
      - uses: actions/upload-artifact@v4
        with:
          name: rsxp-linux-x86_64
          path: artifacts/*.AppImage
          if-no-files-found: error

  core-matrix:
    name: Core feature matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Core contract and GBA tests
        run: cargo test --locked -p rsxp-core -p rsxp-frontend -p rsxp-core-gba
      - name: Core-only and GBA-only builds
        run: |
          cargo test --locked -p rsxp-cores --no-default-features --features gba
          cargo build --locked -p rsxp-desktop --no-default-features --features gba
      - name: Verify the GBA-only binary has no RGSS/MRI dependency
        run: |
          if cargo tree -p rsxp-desktop --no-default-features --features gba -e normal |
            grep -Eq 'rsxp-rgss|rsxp-rgss-ruby|magnus'; then
            echo "GBA-only build unexpectedly links RGSS or MRI" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@nightly
      - name: DS core tests (nightly)
        run: cargo test --locked -p rsxp-core-nds

  desktop:
    name: Desktop / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x86_64
            # Match RubyInstaller's GNU ABI rather than the MSVC default.
            target: x86_64-pc-windows-gnu
            suffix: .exe
          - os: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
            suffix: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:/Program Files/LLVM/bin' >> "$GITHUB_ENV"
      - name: Configure macOS libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: desktop-${{ matrix.target }}-ruby-3.4
      - name: Build desktop
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --bin rsxp --target "$BUILD_TARGET"
      - name: Smoke-test desktop and embedded Ruby
        env:
          BUILD_TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          binary="target/$BUILD_TARGET/release/rsxp$EXE_SUFFIX"
          "$binary" --version
          "$binary" run --script crates/rsxp-rgss/testdata/rgss_smoke.rb --headless
      - name: Bundle Ruby and native dependencies
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python tools/package-runtime.py "target/$BUILD_TARGET/release/rsxp.exe" artifacts/windows
          else
            python tools/package-runtime.py "target/$BUILD_TARGET/release/rsxp" artifacts/macos
          fi
      - name: Test relocated runtime without development environment
        if: runner.os == 'macOS'
        run: |
          mv artifacts/macos 'artifacts/Relocated RSXP'
          binary="$PWD/artifacts/Relocated RSXP/RSXP.app/Contents/MacOS/rsxp"
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            PATH=/usr/bin:/bin "$binary" --version
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH -u DYLD_LIBRARY_PATH -u LD_LIBRARY_PATH \
            PATH=/usr/bin:/bin "$binary" run --script "$PWD/tools/package-smoke.rb" --headless
          mv 'artifacts/Relocated RSXP' artifacts/macos
      - name: Build and test macOS disk image
        if: runner.os == 'macOS'
        run: |
          # The app bundles its own Ruby and libraries, so it ships as a normal
          # drag-to-Applications disk image rather than a system installer.
          mkdir -p artifacts/dmg
          ditto artifacts/macos/RSXP.app artifacts/dmg/RSXP.app
          ln -s /Applications artifacts/dmg/Applications
          hdiutil create -volname RSXP -srcfolder artifacts/dmg -ov -format UDZO \
            artifacts/rsxp-macos-arm64.dmg
          rm -rf artifacts/dmg
          # Mount the image and copy the app out, exactly like dragging it to
          # /Applications, then smoke-test the relocated copy.
          mount=$(mktemp -d)
          install=$(mktemp -d)
          hdiutil attach artifacts/rsxp-macos-arm64.dmg -nobrowse -readonly -mountpoint "$mount"
          test -d "$mount/RSXP.app"
          ditto "$mount/RSXP.app" "$install/RSXP.app"
          hdiutil detach "$mount"
          env -u RUBYLIB -u GEM_HOME -u GEM_PATH PATH=/usr/bin:/bin \
            "$install/RSXP.app/Contents/MacOS/rsxp" run --script "$PWD/tools/package-smoke.rb" --headless
          rm -rf "$install" "$mount"
      - name: Diagnose Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Best-effort diagnostics: this step never fails the job. It reports
          # what the executable imports, which dependencies are unresolved, any
          # embedded manifest, how it behaves under a minimal PATH, and the
          # SideBySide/Application events Windows logged for the failed launch.
          $ErrorActionPreference = 'Continue'
          $portable = Join-Path "$env:RUNNER_TEMP" 'RSXP portable test'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -Recurse -Force artifacts/windows/* $portable

          Write-Host '=== portable contents ==='
          Get-ChildItem $portable | Sort-Object Name |
            Format-Table Name, Length -AutoSize | Out-String | Write-Host

          $objdump = (Get-Command x86_64-w64-mingw32-objdump -ErrorAction SilentlyContinue).Source
          if (-not $objdump) { $objdump = (Get-Command objdump -ErrorAction SilentlyContinue).Source }
          function Get-Imports([string]$path) {
            if (-not $objdump) { return @() }
            (& $objdump -p $path) | Select-String 'DLL Name:\s*(\S+)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
          }
          if ($objdump) {
            Write-Host "=== rsxp.exe imports (via $objdump) ==="
            Get-Imports "$portable\rsxp.exe" | ForEach-Object { Write-Host "  $_" }
            Write-Host '=== unresolved dependencies across the portable set ==='
            $local = @{}
            Get-ChildItem $portable -Filter *.dll | ForEach-Object { $local[$_.Name.ToLowerInvariant()] = $true }
            $missing = 0
            foreach ($bin in @(Get-Item "$portable\rsxp.exe") + @(Get-ChildItem $portable -Filter *.dll)) {
              foreach ($dep in Get-Imports $bin.FullName) {
                if (-not $local.ContainsKey($dep.ToLowerInvariant()) -and
                    -not (Test-Path (Join-Path "$env:SystemRoot\System32" $dep))) {
                  Write-Host "  MISSING: $($bin.Name) -> $dep"
                  $missing++
                }
              }
            }
            Write-Host "  (missing count: $missing)"
          } else {
            Write-Host 'objdump not found; skipping import analysis'
          }

          $manifest = Join-Path "$env:TEMP" 'rsxp.manifest'
          Remove-Item $manifest -ErrorAction SilentlyContinue
          $mt = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\mt.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($mt) { & $mt.FullName "-inputresource:$portable\rsxp.exe;#1" "-out:$manifest" | Out-Null }
          if (Test-Path $manifest) {
            Write-Host '=== rsxp.exe embedded manifest ==='
            Get-Content $manifest | Write-Host
          } else {
            Write-Host '=== no manifest extracted; scanning exe bytes for <assembly> ==='
            $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes("$portable\rsxp.exe"))
            $index = $text.IndexOf('<assembly')
            if ($index -ge 0) { Write-Host $text.Substring($index, [Math]::Min(1600, $text.Length - $index)) }
            else { Write-Host 'no <assembly> block found in exe' }
          }

          function Invoke-Probe([string]$label) {
            Write-Host "=== run: $label ==="
            $out = Join-Path "$env:TEMP" 'rsxp-probe.out'
            $err = Join-Path "$env:TEMP" 'rsxp-probe.err'
            Remove-Item $out, $err -ErrorAction SilentlyContinue
            try {
              $proc = Start-Process -FilePath "$portable\rsxp.exe" -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
              Write-Host ("  exit=0x{0:X8}" -f $proc.ExitCode)
            } catch {
              Write-Host "  launch exception: $($_.Exception.Message)"
            }
            if (Test-Path $out) { Get-Content $out | Write-Host }
            if (Test-Path $err) { Get-Content $err | Write-Host }
          }

          Invoke-Probe 'full development PATH'
          $env:PATH = "$portable;$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:RUBYLIB,Env:GEM_HOME,Env:GEM_PATH -ErrorAction SilentlyContinue
          Invoke-Probe 'minimal PATH (portable + System32)'

          Write-Host '=== recent SideBySide / Application Error events ==='
          Get-WinEvent -LogName Application -MaxEvents 100 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'SideBySide|Application Error|Windows Error Reporting' } |
            Select-Object -First 8 TimeCreated, Id, ProviderName, Message |
            Format-List | Out-String | Write-Host
          exit 0

      - name: Package Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Package before smoke tests so the artifact remains available even
          # when a Windows runtime check exposes a failure for local debugging.
          $portable = Join-Path $env:RUNNER_TEMP 'RSXP portable test'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -Recurse -Force artifacts/windows/* $portable
          $stage = 'artifacts/rsxp-windows-x86_64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force artifacts/windows/* $stage
          Compress-Archive -Path $stage -DestinationPath artifacts/rsxp-windows-x86_64.zip -Force
      - name: Smoke-test Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          # Restrict PATH to the bundled files and Windows itself so the test
          # proves nothing is needed from the build toolchain. Failures remain
          # visible in the job summary but do not prevent artifact upload.
          $portable = Join-Path $env:RUNNER_TEMP 'RSXP portable test'
          $env:PATH = "$portable;$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:RUBYLIB,Env:GEM_HOME,Env:GEM_PATH -ErrorAction SilentlyContinue
          & "$portable\rsxp.exe" --version
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem $portable | Select-Object Name | Out-String | Write-Host
            throw "portable rsxp --version failed ($LASTEXITCODE)"
          }
          & "$portable\rsxp.exe" run --script "$PWD/tools/package-smoke.rb" --headless
          if ($LASTEXITCODE -ne 0) { throw "portable runtime smoke test failed ($LASTEXITCODE)" }
      - name: Upload Windows portable debug files
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rsxp-windows-portable-debug
          path: |
            ${{ runner.temp }}/RSXP portable test/rsxp.exe
            ${{ runner.temp }}/RSXP portable test/*.dll
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && (runner.os == 'Windows' || (runner.os == 'macOS' && hashFiles('artifacts/*.dmg') != ''))
        with:
          name: rsxp-${{ matrix.platform }}
          path: |
            artifacts/*.dmg
            artifacts/*.zip
          if-no-files-found: error

  browser:
    name: Browser bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: rsxp
          authToken: '${{ secrets.CACHIX_KEY }}'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            platforms/web/engine -> target
            platforms/web/xtask -> target
            web -> target
          key: browser
      - name: Build browser player
        run: nix develop --command cargo xtask web
      - name: Check build tool and browser runtime
        run: |
          nix develop --command cargo test --locked --manifest-path platforms/web/xtask/Cargo.toml
          nix develop --command cargo test --locked --manifest-path platforms/web/Cargo.toml
          nix develop --command npm --prefix platforms/web test
          nix develop --command npm --prefix platforms/web run test:cli
      - name: Export the standalone player page
        run: nix develop --command platforms/web/target/release/rsxp-web export platforms/web/dist/rsxp.html
      - uses: actions/upload-artifact@v4
        with:
          name: rsxp.html
          path: platforms/web/dist/rsxp.html
          if-no-files-found: error

  web-player:
    name: Web player / ${{ matrix.platform }}
    needs: browser
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            suffix: ''
          - os: windows-2022
            platform: windows-x86_64
            suffix: .exe
          - os: macos-14
            platform: macos-arm64
            suffix: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        if: runner.os == 'Linux'
      - uses: cachix/cachix-action@v17
        if: runner.os == 'Linux'
        with:
          name: rsxp
          authToken: '${{ secrets.CACHIX_KEY }}'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
      - uses: actions/download-artifact@v4
        with:
          name: rsxp.html
          path: platforms/web/dist
      - name: Stage the exported page as the compile-time embed
        run: cp platforms/web/dist/rsxp.html platforms/web/dist/player.html
      - name: Build native web player
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            nix develop --command cargo build --locked --release --manifest-path platforms/web/Cargo.toml
          else
            cargo build --locked --release --manifest-path platforms/web/Cargo.toml
          fi
      - name: Smoke-test export
        env:
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          "platforms/web/target/release/rsxp-web$EXE_SUFFIX" --help
          "platforms/web/target/release/rsxp-web$EXE_SUFFIX" export platforms/web/dist/export-test.html
          cmp platforms/web/dist/player.html platforms/web/dist/export-test.html
      - name: Package web player
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE_SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p artifacts/rsxp-web
          cp "platforms/web/target/release/rsxp-web$EXE_SUFFIX" artifacts/rsxp-web/
          cp COPYING platforms/web/README.md artifacts/rsxp-web/
          tar -czf "artifacts/rsxp-web-$PLATFORM.tar.gz" -C artifacts rsxp-web
      - uses: actions/upload-artifact@v4
        with:
          name: rsxp-web-${{ matrix.platform }}
          path: artifacts/rsxp-web-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  pages:
    name: Publish GitHub Pages
    needs: browser
    # Only the default branch publishes; pull requests just build.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rsxp.html
          path: site
      - name: Serve the player as the site index
        run: cp site/rsxp.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  release-assets:
    name: Attach build artifacts to GitHub Release
    if: github.event_name == 'release'
    needs: [appimage, desktop, windows-nix, browser, web-player]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rsxp-linux-x86_64
          path: release-assets
          merge-multiple: true
      - name: Download Windows Nix bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rsxp-windows-x86_64-nix
          path: release-assets
          merge-multiple: true
      - name: Download Windows portable bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rsxp-windows-x86_64
          path: release-assets
          merge-multiple: true
      - name: Download macOS disk image
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rsxp-macos-arm64
          path: release-assets
          merge-multiple: true
      - name: Download standalone browser player
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rsxp.html
          path: release-assets
          merge-multiple: true
      - name: Download Linux web player
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rsxp-web-linux-x86_64
          path: release-assets
          merge-multiple: true
      - name: Download Windows web player
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rsxp-web-windows-x86_64
          path: release-assets
          merge-multiple: true
      - name: Download macOS web player
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rsxp-web-macos-arm64
          path: release-assets
          merge-multiple: true
      - name: Upload files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if ((${#assets[@]} == 0)); then
            echo "No build artifacts were downloaded for release $RELEASE_TAG" >&2
            exit 1
          fi
          upload_failed=0
          for asset in "${assets[@]}"; do
            echo "Uploading ${asset#release-assets/}"
            if ! gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Failed to upload ${asset#release-assets/}" >&2
              upload_failed=1
            fi
          done
          exit "$upload_failed"
