[workspace]
members = [
    "crates/rsxp-core",
    "crates/rsxp-cores",
    "crates/rsxp-frontend",
    "crates/rsxp-rgss",
    "cores/gba/core",
    "cores/nds/core",
    "cores/rgss/core",
    "cores/rgss/ruby",
    "frontends/core-runner",
    "frontends/desktop",
]
default-members = ["frontends/desktop"]
resolver = "3"

[profile.release]
# Keep source locations and symbols for perf while retaining release optimization.
lto = true
codegen-units = 1

# Real-time video decoding and per-pixel conversion are too slow without
# optimization, even for Royal's 640x440 intro. Keep debug symbols/assertions
# and the desktop/Ruby glue's normal development settings.
[profile.dev.package.theora-rs]
opt-level = 3

[profile.dev.package.rsxp]
opt-level = 2

# GBA cores are interpreted CPU emulators; unoptimized builds run below real
# time. Keep development builds responsive without changing release settings.
[profile.dev.package.rsxp-core-gba]
opt-level = 3

[profile.dev.package.rustboyadvance-core]
opt-level = 3

[profile.dev.package.arm7tdmi]
opt-level = 3

[profile.dev.package.rustboyadvance-utils]
opt-level = 3

[profile.dev.package.rsxp-desktop]
opt-level = 2

# Dust's utility crate still references SIMD lane bounds removed in Rust 1.96.
[patch."https://github.com/kelpsyberry/emu-utils"]
emu-utils = { path = "cores/nds/vendor/emu-utils" }

[profile.dev.package.dust-core]
opt-level = 3
[profile.dev.package.dust-soft-2d]
opt-level = 3
[profile.dev.package.dust-soft-2d-base]
opt-level = 3
[profile.dev.package.dust-soft-3d]
opt-level = 3
[profile.dev.package.rsxp-core-nds]
opt-level = 3

[patch."https://github.com/kelpsyberry/dust"]
dust-soft-3d = { path = "cores/nds/vendor/dust-soft-3d" }
