[workspace]
members = [
    "crates/rsxp-provision",
    "crates/rsxp-core",
    "crates/rsxp-extension-api",
    "crates/rsxp-api",
    "crates/rsxp-control",
    "crates/rsxp-extensions",
    "crates/rsxp-extension-ui",
    "crates/rsxp-cores",
    "crates/rsxp-frontend",
    "crates/rsxp-ui",
    "crates/rsxp-rgss",
    "cores/gba/core",
    "cores/nds/core",
    "cores/rgss/core",
    "cores/rgss/ruby",
    "frontends/core-runner",
    "frontends/desktop",
]
default-members = ["frontends/desktop"]
resolver = "3"

[profile.release]
# Keep source locations and symbols for perf while retaining release optimization.
# The upstream ARM7TDMI interpreter has unsafe dispatch tables that are
# miscompiled by full-LTO on real cartridges. Keep release optimization and
# one codegen unit, but disable cross-crate LTO for a reliable binary.
lto = false
codegen-units = 1

# RustBoyAdvance-NG contains performance-oriented unsafe interpreter tables.
# These package-scoped settings are supported by Cargo; LTO itself cannot be
# configured per package, so the workspace setting above is intentionally safe
# for every core.
[profile.release.package.rsxp-core-gba]
codegen-units = 1

# Real-time video decoding and per-pixel conversion are too slow without
# optimization, even for Royal's 640x440 intro. Keep debug symbols/assertions
# and the desktop/Ruby glue's normal development settings.
[profile.dev.package.theora-rs]
opt-level = 3

[profile.dev.package.rsxp]
opt-level = 2

# GBA cores are interpreted CPU emulators; unoptimized builds run below real
# time. Keep development builds responsive without changing release settings.
[profile.dev.package.rsxp-core-gba]
opt-level = 3

[profile.dev.package.rustboyadvance-core]
opt-level = 3

[profile.dev.package.arm7tdmi]
opt-level = 3

[profile.dev.package.rustboyadvance-utils]
opt-level = 3

[profile.dev.package.rsxp-desktop]
opt-level = 2

# Dust's utility crate still references SIMD lane bounds removed in Rust 1.96.
[patch."https://github.com/kelpsyberry/emu-utils"]
emu-utils = { path = "cores/nds/vendor/emu-utils" }

[profile.dev.package.dust-core]
opt-level = 3
[profile.dev.package.dust-soft-2d]
opt-level = 3
[profile.dev.package.dust-soft-2d-base]
opt-level = 3
[profile.dev.package.dust-soft-3d]
opt-level = 3
[profile.dev.package.dust-wgpu-2d]
opt-level = 3
[profile.dev.package.dust-wgpu-3d]
opt-level = 3
[profile.dev.package.rsxp-core-nds]
opt-level = 3

[patch."https://github.com/kelpsyberry/dust"]
dust-soft-3d = { path = "cores/nds/vendor/dust-soft-3d" }

# proc-bitfield 0.5.3's "nightly" feature still uses the old `impl const Trait`
# syntax, which modern rustc rejects in favor of `const impl Trait`.
[patch.crates-io]
proc-bitfield = { path = "cores/nds/vendor/proc-bitfield" }
