[package]
name = "rsxp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-or-later"
description = "Native Rust engine for RPG Maker RGSS games"

[dependencies]
web-time = { version = "1.1", optional = true }
getrandom = { version = "0.3", optional = true }
magnus = { version = "0.9.2", default-features = false, features = ["embed"], optional = true }
wgpu = { version = "27.0.1", default-features = false, features = ["std", "vulkan", "gles", "wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
egui = { version = "0.33.3", optional = true }
egui-wgpu = { version = "0.33.3", default-features = false, optional = true }
egui-winit = { version = "0.33.3", default-features = false, features = ["wayland", "x11", "clipboard"], optional = true }
fontdue = { version = "0.9", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"], optional = true }
kira = { version = "0.12.5", default-features = false, features = ["cpal", "flac", "mp3", "ogg", "pcm", "vorbis", "wav"], optional = true }
winit = { version = "0.30.13", features = ["rwh_06", "wayland", "x11"], optional = true }
utoipa = { version = "5.4.0", features = ["macros"], optional = true }
serde_json = { version = "1", optional = true }
# Animated GIF decoding for Bitmap animation, shared by every frontend.
gif = "0.14"
# Pure-Rust Theora/Ogg movie decoding for Graphics.play_movie on every frontend.
ogg = "0.9"
theora-rs = "0.1"
gilrs = { version = "0.11.2", optional = true }

[features]
default = ["desktop", "gpu"]
gpu = ["ui", "dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:egui-wgpu", "dep:egui-winit"]
# The shared egui workspace, used by the native and browser frontends.
ui = ["dep:egui", "dep:web-time"]
# The desktop frontend embeds MRI Ruby through Magnus.
desktop = ["dep:getrandom", "dep:magnus", "dep:fontdue", "dep:image", "dep:kira", "dep:winit", "dep:gilrs", "game-api"]
# Shared local game-command queue, Ruby adapter and egui inspector controls.
game-api = ["dep:serde_json", "dep:image"]
# Compile-time, code-first OpenAPI generation for the MCP/HTTP API binary.
api-docs = ["dep:utoipa"]

[lib]
path = "rust/lib.rs"

[[bin]]
name = "rsxp"
path = "rust/desktop/main.rs"
required-features = ["desktop"]

[[bin]]
name = "rsxp-mcp"
path = "api/main.rs"
required-features = ["api-docs"]

[[test]]
name = "cli"
path = "rust/tests/cli.rs"
required-features = ["desktop"]

[[example]]
name = "render-bench"
path = "rust/examples/render_bench.rs"

[profile.release]
# Keep source locations and symbols for perf while retaining release optimization.
lto = true
codegen-units = 1

[[example]]
name = "session-bench"
path = "rust/examples/session_bench.rs"
required-features = ["desktop", "gpu"]

