[workspace]
members = [
    "crates/fanplay-provision",
    "crates/fanplay-core",
    "crates/fanplay-extension-api",
    "crates/fanplay-api",
    "crates/fanplay-control",
    "crates/fanplay-extensions",
    "crates/fanplay-extension-ui",
    "crates/fanplay-cores",
    "crates/fanplay-frontend",
    "crates/fanplay-ui",
    "crates/fanplay-rgss",
    "crates/fanplay-mcp",
    "crates/fanplay-gba",
    "crates/fanplay-nds",
    "cores/gbc/core",
    "cores/gba/core",
    "cores/nds/core",
    "cores/rgss/core",
    "cores/rgss/ruby",
    "frontends/core-runner",
    "frontends/desktop",
    "frontends/web",
]
default-members = ["frontends/desktop"]
resolver = "3"

[profile.release]
# RustBoyAdvance-NG master forbids unsafe code in the ARM7TDMI/core crates, so
# full cross-crate LTO is safe again and gives the emulator its best release
# performance.
lto = "fat"
codegen-units = 1

# Real-time video decoding and per-pixel conversion are too slow without
# optimization, even for Royal's 640x440 intro. Keep debug symbols/assertions
# and the desktop/Ruby glue's normal development settings.
[profile.dev.package.theora-rs]
opt-level = 3

[profile.dev.package.fanplay-rgss]
opt-level = 2

# GBA cores are interpreted CPU emulators; unoptimized builds run below real
# time. Keep development builds responsive without changing release settings.
[profile.dev.package.fanplay-core-gba]
opt-level = 3

[profile.dev.package.rustboyadvance-core]
opt-level = 3

[profile.dev.package.arm7tdmi]
opt-level = 3

[profile.dev.package.rustboyadvance-utils]
opt-level = 3

[profile.dev.package.fanplay-desktop]
opt-level = 2

# Dust's utility crate still references SIMD lane bounds removed in Rust 1.96.
[patch."https://github.com/kelpsyberry/emu-utils"]
emu-utils = { path = "cores/nds/vendor/emu-utils" }

[profile.dev.package.dust-core]
opt-level = 3
[profile.dev.package.dust-soft-2d]
opt-level = 3
[profile.dev.package.dust-soft-2d-base]
opt-level = 3
[profile.dev.package.dust-soft-3d]
opt-level = 3
[profile.dev.package.dust-wgpu-2d]
opt-level = 3
[profile.dev.package.dust-wgpu-3d]
opt-level = 3
[profile.dev.package.fanplay-core-nds]
opt-level = 3

[patch."https://github.com/kelpsyberry/dust"]
dust-soft-3d = { path = "cores/nds/vendor/dust-soft-3d" }

# proc-bitfield 0.5.3's "nightly" feature still uses the old `impl const Trait`
# syntax, which modern rustc rejects in favor of `const impl Trait`.
[patch.crates-io]
proc-bitfield = { path = "cores/nds/vendor/proc-bitfield" }
