[package]
name = "rsxp-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Shared engine core and Ruby bindings for the rsxp RPG Maker RGSS runtime"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rsxp-mcp"
path = "../api/main.rs"
required-features = ["api-docs"]

[[example]]
name = "render-bench"
path = "examples/render_bench.rs"

[dependencies]
# Animated GIF decoding for Bitmap animation, shared by every frontend.
gif = "0.14"
# Pure-Rust Theora/Ogg movie decoding for Graphics.play_movie on every frontend.
ogg = "0.9"
theora-rs = "0.1"
magnus = { version = "0.9.2", default-features = false, features = ["embed"], optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "gles", "metal", "wgsl"], optional = true }
pollster = { version = "1.0.1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
fontdue = { version = "0.9", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"], optional = true }
utoipa = { version = "6.0.0", features = ["macros"], optional = true }

[features]
default = ["gpu"]
# Portable image/font decoding for frontends without native platform services.
portable-media = ["dep:fontdue", "dep:image"]
# Native GPU composition. Presentation is the frontend's job.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Shared local game-command queue and HTTP routing used by frontends.
game-api = ["dep:image"]
# Embedded MRI Ruby through Magnus: the Ruby compatibility layer and bindings.
ruby = ["dep:magnus"]
# Compile-time, code-first OpenAPI generation for the MCP/HTTP API binary.
api-docs = ["dep:utoipa"]
