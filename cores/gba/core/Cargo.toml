[package]
name = "fanplay-core-gba"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Game Boy Advance core adapter for FANPLAY (RustBoyAdvance-NG backend)"
publish = false

[lib]
name = "fanplay_core_gba"
path = "src/lib.rs"

[dependencies]
fanplay-core = { path = "../../../crates/fanplay-core" }
# RustBoyAdvance-NG is MIT licensed and exposes its emulator as a library
# (rustboyadvance-core). Track the maintained master branch, which contains
# the safe interpreter implementation used by the web build.
rustboyadvance-core = { git = "https://github.com/Rucadi/rustboyadvance-ng", branch = "master", default-features = false }
rustboyadvance-utils = { git = "https://github.com/Rucadi/rustboyadvance-ng", branch = "master", default-features = false }
bytemuck = "1"
serde_json = "1"
sha2 = "0.10"
