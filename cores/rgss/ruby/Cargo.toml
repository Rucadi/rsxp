[package]
name = "fanplay-rgss-ruby"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Embedded Ruby VM and RGSS-native bindings for the RGSS core"

[lib]
name = "ruby_rgss_core"
path = "src/lib.rs"

[dependencies]
fanplay-rgss = { path = "../../../crates/fanplay-rgss", default-features = false, features = ["game-api"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sabiruby = "=0.8.0"
sabiruby-compiler = { version = "=0.5.0", features = ["host"] }
sabiruby-serde = { version = "=0.4.0", features = ["json"] }
flate2 = "1"
glob = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.22"
js-sys = "0.3"
wasm-bindgen = "0.2"
