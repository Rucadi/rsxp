[package]
name = "fanplay-rgss-ruby"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Embedded Ruby VM and RGSS-native bindings for the RGSS core"

[features]
default = []
ruby = []

[lib]
name = "ruby_rgss_core"
path = "src/lib.rs"

[dependencies]
fanplay-rgss = { path = "../../../crates/fanplay-rgss", default-features = false, features = ["game-api"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
magnus = { version = "0.9.2", default-features = false, features = ["embed"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
base64 = "0.22"
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(target_os = "wasi")'.dependencies]
magnus = { version = "0.9.2", default-features = false, features = ["rb-sys"] }
