[package]
name = "fanplay-extensions"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Sandboxed Rhai extension host for FANPLAY"
publish = false

[dependencies]
fanplay-api = { path = "../fanplay-api" }
fanplay-extension-api = { path = "../fanplay-extension-api" }
rhai = { version = "1.27", features = ["serde"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { version = "1.27", features = ["serde", "wasm-bindgen"] }
