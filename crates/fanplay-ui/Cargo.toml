[package]
name = "fanplay-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Shared eframe application for desktop and Android"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["game-api"]
game-api = ["fanplay-rgss/game-api"]

[dependencies]
fanplay-gba = { path = "../fanplay-gba" }
fanplay-nds = { path = "../fanplay-nds", default-features = false, features = ["ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
fanplay-rgss = { path = "../fanplay-rgss", default-features = false, features = ["game-api", "portable-media"] }
fanplay-extension-api = { path = "../fanplay-extension-api" }
fanplay-extensions = { path = "../fanplay-extensions" }
fanplay-extension-ui = { path = "../fanplay-extension-ui" }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
egui = { version = "0.37.0", features = ["default_fonts"] }
base64 = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "clipboard", "system_fonts"] }

[package.metadata.android]
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
