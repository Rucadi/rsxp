[package]
name = "rsxp-cores"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Build-time core registry for RSXP frontends"
publish = false

[features]
default = ["gba", "nds"]
gba = ["dep:rsxp-core-gba"]
nds = ["dep:rsxp-core-nds"]
rgss = ["dep:rsxp-core-rgss"]

[dependencies]
rsxp-core-nds = { path = "../../cores/nds/core", optional = true }
rsxp-core = { path = "../rsxp-core" }
rsxp-frontend = { path = "../rsxp-frontend" }
rsxp-core-gba = { path = "../../cores/gba/core", optional = true }
rsxp-core-rgss = { path = "../../cores/rgss/core", optional = true }
