[package]
name = "rsxp-extensions"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Sandboxed Rhai extension host for RSXP"
publish = false

[dependencies]
rsxp-api = { path = "../rsxp-api" }
rsxp-extension-api = { path = "../rsxp-extension-api" }
rhai = { version = "1.27", features = ["serde"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
rhai = { version = "1.27", features = ["serde", "wasm-bindgen"] }
