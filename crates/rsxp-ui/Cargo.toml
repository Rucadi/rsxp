[package]
name = "rsxp-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Shared eframe application for desktop, web, and Android"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rsxp = { path = "../rsxp-rgss", default-features = false, features = ["ui", "game-api", "portable-media"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
egui = { version = "0.37.0", features = ["default_fonts"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "android-native-activity"] }
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "clipboard", "system_fonts"] }

[package.metadata.android]
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
