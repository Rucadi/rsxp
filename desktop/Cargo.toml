[package]
name = "rsxp-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
rsxp = { path = "..", features = ["gpu", "ui", "game-api", "portable-media"] }
ruby_rgss_core = { path = "../ruby_rgss_core" }
getrandom = "0.4.3"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "gles", "metal", "wgsl"] }
pollster = "1.0.1"
bytemuck = { version = "1", features = ["derive"] }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = ["wayland", "x11", "clipboard"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
kira = { version = "0.12.5", default-features = false, features = ["cpal", "flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
winit = { version = "0.30.13", features = ["rwh_06", "wayland", "x11"] }
gilrs = "0.11.2"
rfd = "0.17.2"
serde_json = "1"

[dev-dependencies]
gif = "0.14"

[features]
default = ["gpu"]
gpu = []
game-tests = []

[[bin]]
name = "rsxp"
path = "../src/desktop/main.rs"

[[test]]
name = "cli"
path = "../src/tests/cli.rs"

# Manual tests requiring local game trees (`ericlostie/`, `pokemonz/`).
[[test]]
name = "game-tests"
path = "../src/tests/game-tests.rs"
required-features = ["game-tests"]

[[example]]
name = "session-bench"
path = "../src/examples/session_bench.rs"

