[package]
name = "fanplay-core-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Headless runner for any FANPLAY core"
publish = false

[features]
default = ["gbc", "gba", "nds"]
gbc = ["fanplay-cores/gbc"]
gba = ["fanplay-cores/gba"]
nds = ["fanplay-cores/nds"]
rgss = ["fanplay-cores/rgss"]

[dependencies]
fanplay-core = { path = "../../crates/fanplay-core" }
fanplay-frontend = { path = "../../crates/fanplay-frontend" }
fanplay-cores = { path = "../../crates/fanplay-cores", default-features = false }

[[bin]]
name = "fanplay-core-runner"
path = "src/main.rs"
