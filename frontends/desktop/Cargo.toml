[package]
name = "rsxp-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
rsxp-core-nds = { path = "../../cores/nds/core", optional = true }
rsxp-core-gba = { path = "../../cores/gba/core", optional = true }
rsxp = { path = "../../crates/rsxp-rgss", features = ["gpu", "ui", "game-api", "portable-media"], optional = true }
rsxp-core = { path = "../../crates/rsxp-core" }
rsxp-extension-api = { path = "../../crates/rsxp-extension-api" }
rsxp-cores = { path = "../../crates/rsxp-cores", default-features = false }
rsxp-frontend = { path = "../../crates/rsxp-frontend" }
rsxp-ui = { path = "../../crates/rsxp-ui", optional = true }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "clipboard", "system_fonts"] }
ruby_rgss_core = { package = "rsxp-rgss-ruby", path = "../../cores/rgss/ruby", optional = true }
getrandom = "0.4.3"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "gles", "metal", "wgsl"] }
pollster = "1.0.1"
bytemuck = { version = "1", features = ["derive"] }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = ["wayland", "x11", "clipboard"] }
wry = "0.57"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
kira = { version = "0.12.5", default-features = false, features = ["cpal", "flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
cpal = "0.18"
winit = { version = "0.30.13", features = ["rwh_06", "wayland", "x11"] }
rfd = "0.17.2"
serde_json = "1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
gilrs = "0.11.2"

# XInput avoids the Windows Gaming Input API, which returns E_NOTIMPL in Wine.
[target.'cfg(target_os = "windows")'.dependencies]
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
gif = "0.14"

[features]
default = ["gpu", "gba", "nds", "rgss"]
gba = ["dep:rsxp-core-gba", "rsxp-cores/gba"]
nds = ["dep:rsxp-core-nds", "rsxp-cores/nds"]
rgss = ["dep:rsxp", "dep:rsxp-ui", "dep:ruby_rgss_core", "rsxp-cores/rgss"]
gpu = []
game-tests = []

[[bin]]
name = "rsxp"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["rgss"]

# Manual tests requiring local game trees (`ericlostie/`, `pokemonz/`).
[[test]]
name = "game-tests"
path = "tests/game-tests.rs"
required-features = ["game-tests"]

[[example]]
name = "session-bench"
path = "examples/session_bench.rs"
required-features = ["rgss", "gpu"]
