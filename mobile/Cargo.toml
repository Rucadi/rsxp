[package]
# cargo-mobile2 passes `--package <app.name>` and expects the Cargo package to
# match `[app].name` in mobile.toml; the library keeps its platform-facing name.
name = "rsxp-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Native Rust engine for RPG Maker RGSS games on iOS and Android"

# `cargo-mobile2` manages `gen/android` and `gen/apple`. Keep this crate out of
# the desktop workspace so mobile cargo invocations do not build the whole tree.
[workspace]

[lib]
name = "rsxp_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rsxp-mobile-desktop"
path = "src/desktop.rs"

[[test]]
name = "native_mri"
path = "tests/native_mri.rs"
harness = false

# NativeActivity is provided by winit/android-activity.
[package.metadata.cargo-android]
app-activity-name = "android.app.NativeActivity"
app-permissions = []
vulkan-validation = false
cargo-args = ["--lib"]

[package.metadata.cargo-apple.ios]
frameworks = ["Metal", "QuartzCore", "UIKit"]
cargo-args = ["--lib"]

[dependencies]
rsxp = { path = "..", default-features = false, features = ["gpu", "ui", "game-api", "portable-media"] }
ruby_rgss_core = { path = "../ruby_rgss_core", default-features = false, features = ["mobile"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"

wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "gles", "metal", "wgsl"] }
bytemuck = "1"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "android-native-activity"] }
kira = { version = "0.12.5", default-features = false, features = ["cpal", "flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["wayland", "x11", "wayland-dlopen"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.17.2"
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
jni = "0.21"
ndk = "0.9"
ndk-sys = "0.6"
ndk-context = "0.1"

[build-dependencies]
cc = "1"
sha2 = "0.10"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The root workspace's development overrides do not propagate here.
[profile.dev.package.rsxp]
opt-level = 2

[profile.dev.package.theora-rs]
opt-level = 3
