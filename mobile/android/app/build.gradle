plugins { id 'com.android.application' }
android {
    namespace 'org.rsxp.mobile'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '28.1.13356709'
    defaultConfig {
        applicationId 'org.rsxp.mobile'
        minSdk 26
        // API 28 keeps the legacy behaviour that lets the Termux-patched Ruby
        // load its extracted standard-library extensions from app storage.
        // Raise this after shipping those extensions through a native loader.
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments "-DRSXP_CORE=${rootProject.projectDir}/../build/android/arm64-v8a/librsxp_mobile.so" } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets {
        main {
            assets.srcDirs = ["${rootProject.projectDir}/../build/android/assets"]
            jniLibs.srcDirs = ["${rootProject.projectDir}/../build/android/jniLibs"]
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    buildTypes { release { minifyEnabled false } }
}
