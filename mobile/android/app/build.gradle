plugins { id 'com.android.application' }
android {
    namespace 'org.rsxp.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'org.rsxp.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments "-DRSXP_CORE=${rootProject.projectDir}/../build/android/arm64-v8a/librsxp_mobile.so" } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { assets.srcDirs = ["${rootProject.projectDir}/../build"]; assets.includes = ['ui/**', 'runtime/**'] } }
    buildTypes { release { minifyEnabled false } }
}
