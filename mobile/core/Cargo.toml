[package]
name = "rsxp-mobile"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "native_mri"
path = "tests/native_mri.rs"
harness = false

[dependencies]
rsxp-core = { path = "../../core", default-features = false, features = ["game-api", "portable-media", "gpu"] }
serde_json = "1"
base64 = "0.22"
bytemuck = "1"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "gles", "metal", "wgsl"] }

[build-dependencies]
cc = "1"

