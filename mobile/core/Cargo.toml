[package]
name = "rsxp-mobile"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "native_mri"
path = "tests/native_mri.rs"
harness = false

[dependencies]
rsxp = { path = "../..", default-features = false, features = ["game-api", "portable-media"] }
serde_json = "1"
base64 = "0.22"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
