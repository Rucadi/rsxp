<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>rsxp player</title>
<style>
:root{color-scheme:dark;--bg:#0A0A14;--surface:#12121F;--border:#2A2A3E;--text:#EEEEF0;--muted:#9999AA;--pink:#FF006E;--cyan:#00F0FF}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.6 "Work Sans",system-ui,sans-serif}
#screen{display:block;width:100%;height:100%;touch-action:none;background:var(--bg)}
#launch-status{position:fixed;inset:24px;margin:auto;width:min(520px,calc(100vw - 48px));height:max-content;
  padding:24px 28px;pointer-events:none;white-space:pre-wrap;text-align:center;background:var(--surface);
  border:1px solid rgba(255,0,110,.55);border-radius:12px;color:var(--text);
  box-shadow:0 0 24px rgba(255,0,110,.28);font:14px/1.6 "Space Mono",ui-monospace,monospace}
#launch-status::before{content:"RSXP  /  PLAYER";display:block;margin-bottom:10px;color:var(--pink);
  font:11px/1.4 "Space Mono",ui-monospace,monospace;letter-spacing:.12em}
[hidden]{display:none!important}
</style>
<canvas id="screen" width="640" height="480" aria-label="Game library and workspace. F1 opens controls; F2 opens tools."></canvas>
<p id="launch-status" role="status" aria-live="polite">Starting workspace…</p>
<input id="game-folder" type="file" webkitdirectory multiple hidden>
<input id="game-zip" type="file" accept=".zip,application/zip" hidden>
<input id="game-rom" type="file" accept=".gba,.nds,application/octet-stream" hidden>
<script id="rsxp-payload" type="application/json">__RSXP_PAYLOAD__</script>
<script type="module">
const payload = JSON.parse(document.getElementById('rsxp-payload').textContent);
const urls = new Map();
function decode(text) {
  const padding = text.endsWith('==') ? 2 : text.endsWith('=') ? 1 : 0;
  const bytes = new Uint8Array(text.length / 4 * 3 - padding);
  let output = 0;
  for (let offset = 0; offset < text.length; offset += 65536) {
    const part = atob(text.slice(offset, offset + 65536));
    for (let i = 0; i < part.length; i += 1) bytes[output++] = part.charCodeAt(i);
  }
  return bytes;
}
function moduleURL(name) {
  if (urls.has(name)) return urls.get(name);
  let source = payload.modules[name];
  if (source === undefined) throw new Error('Missing embedded module: ' + name);
  source = source.replace(/(from\s+)(['"])(\.\/[^'"]+)\2/g, (_match, prefix, quote, path) => {
    const base = name.includes('/') ? name.slice(0, name.lastIndexOf('/') + 1) : '';
    return prefix + quote + moduleURL(base + path.slice(2)) + quote;
  });
  const url = URL.createObjectURL(new Blob([source], {type:'text/javascript'}));
  urls.set(name, url);
  return url;
}
globalThis.RSXP_BUNDLE = {payload, decode, load: name => import(moduleURL(name))};
try { await globalThis.RSXP_BUNDLE.load('player-launcher.js'); }
catch (error) { const status = document.getElementById('launch-status'); status.hidden = false; status.textContent = String(error); }
</script>
</html>
