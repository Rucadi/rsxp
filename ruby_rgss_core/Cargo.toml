[package]
name = "ruby_rgss_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
description = "Embedded Ruby VM and RGSS-native bindings for rsxp"

[dependencies]
magnus = { version = "0.9.2", default-features = false, features = ["embed"] }
rsxp = { path = "..", default-features = false, features = ["game-api"] }

[profile.release]
# Keep source locations and symbols for perf while retaining release optimization.
lto = true
codegen-units = 1