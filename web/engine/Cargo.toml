[package]
name = "rsxp-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-or-later"
description = "Browser (WebAssembly) frontend for the rsxp engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rsxp = { path = "../..", default-features = false, features = ["ui", "game-api"] }
# The browser workspace renders through wgpu's WebGL2 backend, which the browser
# software-emulates when the GPU is disabled, so no GPU is required.
wgpu = { version = "27.0.1", default-features = false, features = ["webgl", "webgpu", "wgsl", "std"] }
egui = "0.33.3"
egui-wgpu = { version = "0.33.3", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.121"
js-sys = "=0.3.98"
wasm-bindgen-futures = "=0.4.71"
web-sys = { version = "=0.3.98", features = [
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "GainNode",
    "HtmlCanvasElement",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "MediaElementAudioSourceNode",
    "Performance",
    "Url",
    "Window",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
fontdue = "0.9"
console_error_panic_hook = "0.1"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
